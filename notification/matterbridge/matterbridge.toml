# =====================================================================
# Matterbridge Configuration for NETAct Notifications
# =====================================================================

# 1. Define the HTTP API listener inside the Docker network
[api.local]
BindAddress = "0.0.0.0:4242"
Buffer = 1000

# 2. Define chat platform protocols (configure credentials as needed)
# Simply uncomment the protocol block and insert your credentials.

[slack.myslack]
# Token="xoxb-YOUR_SLACK_BOT_TOKEN"

[telegram.mytelegram]
# Token="YOUR_TELEGRAM_BOT_TOKEN"

[discord.mydiscord]
# Token="YOUR_DISCORD_BOT_TOKEN"

[msteams.myteams]
# WebhookURL="https://m365.webhook.office.com/..."

[whatsapp.mywhatsapp]
# Number="YOUR_PHONE_NUMBER"

[matrix.mymatrix]
# Server="https://matrix.org"
# Login="username"
# Password="password"

[mattermost.mymattermost]
# Server="https://mattermost.example.com"
# Token="YOUR_MATTERMOST_TOKEN"

[irc.myirc]
# Server="irc.freenode.net:6667"
# Nick="NETActBot"

[xmpp.myxmpp]
# Server="jabber.org:5222"
# Jid="netact@jabber.org"
# Password="password"

[zulip.myzulip]
# Server="https://zulip.example.com"
# Email="bot@example.com"
# ApiKey="YOUR_ZULIP_API_KEY"

[rocketchat.myrocketchat]
# Server="https://rocketchat.example.com"
# Token="YOUR_TOKEN"
# UserId="YOUR_USER_ID"

[keybase.mykeybase]
# PaperKey="YOUR_KEYBASE_PAPER_KEY"

[mastodon.mymastodon]
# Server="https://mastodon.social"
# Token="YOUR_MASTODON_ACCESS_TOKEN"

[twitch.mytwitch]
# Server="irc.chat.twitch.tv:6667"
# Nick="TwitchChannel"
# Password="oauth:YOUR_TWITCH_OAUTH_TOKEN"

[gitter.mygitter]
# Token="YOUR_GITTER_TOKEN"


# 3. Gateways bridging API requests to destination channels
# Active gateways route API posts targeting a gateway back to the corresponding client.

[[gateway]]
name = "netact_slack"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "slack.myslack"
channel = "#alerts"

[[gateway]]
name = "netact_telegram"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "telegram.mytelegram"
channel = "-100123456789"

[[gateway]]
name = "netact_discord"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "discord.mydiscord"
channel = "123456789"

[[gateway]]
name = "netact_teams"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "msteams.myteams"
channel = "teams"

[[gateway]]
name = "netact_whatsapp"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "whatsapp.mywhatsapp"
channel = "YOUR_WHATSAPP_CHAT_ID"

[[gateway]]
name = "netact_matrix"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "matrix.mymatrix"
channel = "#alerts:matrix.org"

[[gateway]]
name = "netact_mattermost"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "mattermost.mymattermost"
channel = "alerts"

[[gateway]]
name = "netact_irc"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "irc.myirc"
