enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "xmpp.myxmpp"
channel = "alerts@conference.jabber.org"

[[gateway]]
name = "netact_zulip"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "zulip.myzulip"
channel = "alerts"

[[gateway]]
name = "netact_rocketchat"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "rocketchat.myrocketchat"
channel = "alerts"

[[gateway]]
name = "netact_keybase"
enable = true
[[gateway.inout]]
account = "api.local"
channel = "api"
[[gateway.inout]]
account = "keybase.mykeybase"
channel = "alerts"

[[gateway]]
name = "netact_mastodon"
enable = true
[[gateway.inout]]
account = "api.local"
