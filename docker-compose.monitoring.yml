###############################################################################
# NETAct — Compose 5: Monitoring Stack
#
# Requires core stack running first.
# Scrapes NETAct_backend:8000 and NETAct_ollama_exporter:9110 on shared network.
#
# Start:   docker compose -f docker-compose.monitoring.yml up -d
# Stop:    docker compose -f docker-compose.monitoring.yml down
# Grafana: http://localhost:3002
###############################################################################

name: netact

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: NETAct_prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - config-net

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: NETAct_grafana_renderer
    restart: unless-stopped
    environment:
      - ENABLE_METRICS=true
      - AUTH_TOKEN=${GRAFANA_RENDERER_TOKEN:-26b30384c0c894e3248dd607f1c8279bd2847ad7445e2fbb}
    networks:
      - config-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: NETAct_grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://127.0.0.1:3002/}
      - GF_RENDERING_SERVER_URL=http://NETAct_grafana_renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://NETAct_grafana:3000/
      - GF_RENDERING_RENDERER_TOKEN=${GRAFANA_RENDERER_TOKEN:-26b30384c0c894e3248dd607f1c8279bd2847ad7445e2fbb}
      - GF_LOG_FILTERS=rendering:debug
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - grafana-renderer
    networks:
      - config-net

volumes:
  prometheus-data:
  grafana-data:

networks:
  config-net:
    external: true
    name: netact_config-net
