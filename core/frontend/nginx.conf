server {
    listen 443 ssl;
    ssl_certificate     /etc/ssl/netact/server.crt;
    ssl_certificate_key /etc/ssl/netact/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver for dynamic upstreams
    resolver 127.0.0.11 valid=30s;

    # Increase client body size for large config uploads
    client_max_body_size 50M;

    # Global proxy timeout settings
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    
    # Buffer settings for large responses
    proxy_buffering off;
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/automation/ {
        set $automation_url http://automation:8003;
        rewrite ^/api/automation/(.*)$ /$1 break;
        proxy_pass $automation_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /copilot/ {
        set $copilot_url http://copilot-frontend:80;
        rewrite ^/copilot/(.*)$ /$1 break;
        proxy_pass $copilot_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/copilot/ {
        set $copilot_backend_url http://copilot-backend:8002;
        rewrite ^/api/copilot/(.*)$ /api/copilot/$1 break;
        proxy_pass $copilot_backend_url;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }


    location /api/ {
        set $backend_url http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_url;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout overrides for API calls
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        
        # Disable buffering for real-time output
        proxy_buffering off;
        
        # Handle chunked encoding properly
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}